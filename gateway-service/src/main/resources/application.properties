# API Gateway Configuration
spring.application.name=gateway-service
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== Routes Configuration =====

# Route vers Events Service
spring.cloud.gateway.routes[0].id=events-service
spring.cloud.gateway.routes[0].uri=lb://events-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/events/**

# Route vers Participant Service
spring.cloud.gateway.routes[1].id=participant-service
spring.cloud.gateway.routes[1].uri=lb://participant-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/participants/**

# Route vers Notification Service
spring.cloud.gateway.routes[2].id=notification-service
spring.cloud.gateway.routes[2].uri=lb://notification-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/notifications/**

# Enable Gateway Discovery (optionnel - pour découverte automatique)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# CORS Configuration (pour le frontend)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
